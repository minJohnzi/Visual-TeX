<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 536" width="920" height="536" role="img" aria-label="Visual-TeX Transaction Flow and Dual-Engine Architecture Diagram">
  <defs>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#1e293b" />
    </pattern>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#111a2e" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.45" />
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #f8fafc;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #94a3b8;
    }
    .badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .edge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="920" height="536" rx="16" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="920" height="536" rx="16" fill="url(#dotGrid)" />
  <rect x="1" y="1" width="918" height="534" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Connectors: Row 1 -> Row 2 -->
  <path d="M 460 88 V 128 H 208 V 148" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)" />
  <path d="M 460 128 H 712 V 148" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)" />
  <rect x="344" y="96" width="232" height="24" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" />
  <text x="460" y="112" text-anchor="middle" class="edge-label" fill="#93c5fd">CommandBus Unified Dispatch</text>

  <!-- Connector: Row 2 Horizontal Sync -->
  <line x1="376" y1="208" x2="544" y2="208" stroke="#38bdf8" stroke-width="2" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)" />
  <rect x="394" y="176" width="132" height="22" rx="11" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" />
  <text x="460" y="191" text-anchor="middle" class="badge">EditOrigin + seq</text>
  <text x="460" y="232" text-anchor="middle" class="edge-label">Loop-Free Sync Guard</text>

  <!-- Connectors: Row 2 -> Row 3 -->
  <path d="M 208 262 V 290 H 442 V 312" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <path d="M 712 262 V 290 H 478 V 312" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />

  <!-- Connectors: Row 3 -> Row 4 -->
  <path d="M 460 390 V 412 H 232 V 430" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <path d="M 460 412 H 688 V 430" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />

  <!-- Node 1: SymbolPalette / EditorToolbar -->
  <g filter="url(#cardShadow)">
    <rect x="245" y="24" width="430" height="64" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="245" y="24" width="6" height="64" rx="3" fill="#3b82f6" />
    <text x="460" y="51" text-anchor="middle" class="title">SymbolPalette / EditorToolbar</text>
    <text x="460" y="72" text-anchor="middle" class="subtitle">185+ Symbols · Matrix Picker · Derive Next Step · Formatting</text>
  </g>

  <!-- Node 2L: VisualEditor -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="154" width="320" height="108" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="1.5" />
    <rect x="48" y="154" width="320" height="4" rx="2" fill="#3b82f6" />
    <rect x="64" y="168" width="62" height="20" rx="6" fill="#1d4ed8" fill-opacity="0.35" stroke="#3b82f6" stroke-width="1" />
    <text x="95" y="182" text-anchor="middle" class="badge">VISUAL</text>
    <text x="208" y="183" text-anchor="middle" class="title">VisualEditor</text>
    <text x="208" y="212" text-anchor="middle" class="subtitle">&lt;math-field&gt; (MathLive) · Inline Triggers</text>
    <text x="208" y="234" text-anchor="middle" class="subtitle">Live Synced LaTeX Strip</text>
  </g>

  <!-- Node 2R: SourceEditor -->
  <g filter="url(#cardShadow)">
    <rect x="552" y="154" width="320" height="108" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="552" y="154" width="320" height="4" rx="2" fill="#8b5cf6" />
    <rect x="568" y="168" width="62" height="20" rx="6" fill="#6d28d9" fill-opacity="0.35" stroke="#8b5cf6" stroke-width="1" />
    <text x="599" y="182" text-anchor="middle" class="badge">SOURCE</text>
    <text x="712" y="183" text-anchor="middle" class="title">SourceEditor</text>
    <text x="712" y="212" text-anchor="middle" class="subtitle">CodeMirror 6 · Highlight &amp; Auto-Pair</text>
    <text x="712" y="234" text-anchor="middle" class="subtitle">\Cmd Autocomplete · Error Range Jump</text>
  </g>

  <!-- Node 3: Zustand Store -->
  <g filter="url(#cardShadow)">
    <rect x="230" y="318" width="460" height="72" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <rect x="230" y="318" width="6" height="72" rx="3" fill="#10b981" />
    <text x="460" y="348" text-anchor="middle" class="title">Zustand Document Store (useAppStore)</text>
    <text x="460" y="370" text-anchor="middle" class="subtitle">Monotonic seq Guard · 50-Step Undo/Redo · localStorage Persistence</text>
  </g>

  <!-- Node 4L: KaTeX Live Preview -->
  <g filter="url(#cardShadow)">
    <rect x="48" y="436" width="368" height="78" rx="12" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5" />
    <rect x="48" y="436" width="6" height="78" rx="3" fill="#14b8a6" />
    <text x="235" y="466" text-anchor="middle" class="title">Main-Thread Live Preview (KaTeX)</text>
    <text x="235" y="489" text-anchor="middle" class="subtitle">Single · Mixed Blocks · MathML · Locate in Source</text>
  </g>

  <!-- Node 4R: MathJax 4 Web Worker -->
  <g filter="url(#cardShadow)">
    <rect x="504" y="436" width="368" height="78" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="504" y="436" width="6" height="78" rx="3" fill="#f59e0b" />
    <text x="691" y="466" text-anchor="middle" class="title">Offline Vector Worker (MathJax 4)</text>
    <text x="691" y="489" text-anchor="middle" class="subtitle">Pure-Path SVG · 1x–5x Canvas PNG · Bundled NewCM</text>
  </g>
</svg>
