<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual-TeX | Visual & Source LaTeX Formula Studio</title>
    <meta name="description" content="Visual-TeX - 专业纯前端 LaTeX 可视化编辑与实时渲染 Web 工作台，结合 KaTeX 极速渲染与高清图片矢量导出。" />
    <link rel="canonical" href="https://visual-tex.ai.studio" />
    <meta property="og:title" content="Visual-TeX | Visual & Source LaTeX Formula Studio" />
    <meta property="og:description" content="Visual-TeX - 专业纯前端 LaTeX 可视化编辑与实时渲染 Web 工作台，结合 KaTeX 极速渲染与高清图片矢量导出。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://visual-tex.ai.studio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://visual-tex.ai.studio" />
    <!-- KaTeX CSS for live rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    <!-- MathJax 3 for standalone vector SVG generation -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: {
          fontCache: 'local'
        },
        startup: {
          typeset: false
        }
      };
      function loadMathJaxFallback() {
        if (!window.MathJax || typeof window.MathJax.tex2svg !== 'function') {
          var s = document.createElement('script');
          s.id = 'MathJax-script-fallback';
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js';
          document.head.appendChild(s);
        }
      }
    </script>
    <script defer id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" onerror="loadMathJaxFallback()"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
