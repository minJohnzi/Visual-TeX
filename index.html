<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaTeX Formula Editor - 实时可视化公式编辑器</title>
    <meta name="description" content="专业纯前端 LaTeX 可视化编辑与实时渲染 Web 工作台，结合 KaTeX 极速渲染与高清图片矢量导出。" />
    <meta property="og:title" content="LaTeX Formula Editor - 实时可视化公式编辑器" />
    <meta property="og:description" content="专业纯前端 LaTeX 可视化编辑与实时渲染 Web 工作台，结合 KaTeX 极速渲染与高清图片矢量导出。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- KaTeX CSS for live rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <!-- MathJax 3 for standalone vector SVG generation -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: {
          fontCache: 'local'
        },
        startup: {
          typeset: false
        }
      };
    </script>
    <script defer id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
